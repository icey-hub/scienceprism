<!doctype html>
<html lang="zh-CN" data-theme="light" data-motion="full" data-transparency="full" data-contrast="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SciencePrism · 前端设计 Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b5e'/%3E%3Cstop offset='.5' stop-color='%2335c98a'/%3E%3Cstop offset='1' stop-color='%238f6bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/views.css">
<link rel="stylesheet" href="styles/motion.css">
<script>
/* 首帧前解析偏好，避免主题闪烁。JS 侧 core.js 会接管并可被 Demo 面板覆盖。 */
(function () {
  var d = document.documentElement;
  var m = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
  d.dataset.theme = m('(prefers-color-scheme: dark)') ? 'dark' : 'light';
  d.dataset.motion = m('(prefers-reduced-motion: reduce)') ? 'reduced' : 'full';
  d.dataset.transparency = m('(prefers-reduced-transparency: reduce)') ? 'reduced' : 'full';
  d.dataset.contrast = m('(prefers-contrast: more)') ? 'more' : 'normal';
})();
</script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主内容</a>

  <div id="layer-root" class="layer-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="scripts/core.js"></script>
  <script src="scripts/motion.js"></script>
  <script src="scripts/glass.js"></script>
  <script src="scripts/data.js"></script>

  <script src="scripts/views/start.js"></script>

</body>
</html>
