<text x="250" y="566" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#64748b">颜色 = 角色</text>
<circle cx="380" cy="562" r="6" fill="#047857"/>
<text x="392" y="566" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#1e293b">研究者</text>
<circle cx="548" cy="562" r="6" fill="#1d4ed8"/>
<text x="560" y="566" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#1e293b">前端</text>
<circle cx="716" cy="562" r="6" fill="#6d28d9"/>
<text x="728" y="566" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#1e293b">后端 Runtime</text>
<circle cx="884" cy="562" r="6" fill="#b45309"/>
<text x="896" y="566" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#1e293b">模型</text>
<text x="26" y="596" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#64748b">⑦ 之后才进入下一阶段：AI 可以产出与建议，但不能代替人工批准。</text>
</svg>
