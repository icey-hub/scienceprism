<path d="M 920 100 L 920 510" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 6" opacity="0.5"/>
<path d="M 208 152 L 432 152" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
