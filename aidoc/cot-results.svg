<text x="28" y="380" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="12.5" font-weight="500" text-anchor="start" fill="#64748b">判分伪影：6 次数值相等但字符串不同（如 12 vs 12.00），另 2 次解析失败。</text>
<text x="28" y="402" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#1e293b">结论：对推理模型而言，提示方式几乎不改变结果；主要误差来自题目难度与判分规则，而不是提示。</text>
<text x="28" y="440" font-family="Hiragino Sans GB, PingFang SC, Heiti SC, sans-serif" font-size="11.5" font-weight="500" text-anchor="start" fill="#64748b">数据：GSM8K 测试集（Cobbe et al., 2021），aidoc/experiment-cot-gsm8k.json，temperature 0，串行调用</text>
