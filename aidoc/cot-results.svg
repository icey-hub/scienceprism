<text x="750" y="295" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#6b7280">The reverse: 1.</text>
<text x="30" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#6b7280">Grading: exact match under-counts by 1.0 points — 6 responses were numerically equal but textually different (12 vs 12.00), 2 failed to parse.</text>
<text x="30" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#111827">Item difficulty and the grading rule dominate; the prompt does not. 188 of 200 items were right in all three conditions and 8 in none.</text>
<text x="30" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#6b7280">Data: GSM8K test split (Cobbe et al., 2021). aidoc/experiment-cot-gsm8k.json. Every number recomputed from the stored generations.</text>
